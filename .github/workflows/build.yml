name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to attach Cera.zip to a release when a v* tag is pushed

jobs:
  build:
    runs-on: macos-15
    env:
      # MermaidKit needs Swift 6.2 or later; the image's default Xcode (16.4) has Swift 6.1.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # A release's notes are its version's section of CHANGELOG.md. Checked before the slow
      # signing and notarizing, so a release without notes stops early.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build Cera.app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./scripts/bundle.sh --zip

      # Releases are signed with the Developer ID and notarized, so downloads open without
      # a Gatekeeper warning. The certificate and notary password come from repository secrets.
      - name: Build, sign, and notarize Cera.app
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Resources/Info.plist"
            exit 1
          fi
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Missing repository secret $name"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials cera-notary --keychain "$keychain" \
            --apple-id "$NOTARY_APPLE_ID" --team-id NEFPW9V798 --password "$NOTARY_PASSWORD"
          CERA_NOTARY_KEYCHAIN="$keychain" ./scripts/bundle.sh --release

      - name: Remove signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload Cera.app
        uses: actions/upload-artifact@v7
        with:
          name: Cera
          path: build/Cera.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Cera.zip --title "Cera $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # Points the Homebrew cask at the new release. A deploy key that can push only to
      # plattnum/homebrew-cera comes from a repository secret.
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [ -n "$TAP_DEPLOY_KEY" ] || { echo "::error::Missing repository secret HOMEBREW_TAP_DEPLOY_KEY"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          sha256="$(shasum -a 256 build/Cera.zip | cut -d ' ' -f 1)"
          key="$RUNNER_TEMP/tap_deploy_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:plattnum/homebrew-cera.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$sha256\"/" Casks/cera.rb
          git diff --quiet && { echo "Cask already at $version"; exit 0; }
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "Cera $version"
          git push -q
